# https://github.com/crate-ci/typos

[files]
extend-exclude = ["docs/superpowers/"]

[default]
extend-ignore-re = [
    # Long hex digests (commit SHAs, hashes)
    "[0-9a-fA-F]{32,}",
]

[default.extend-words]
# Domain terms and names that look like typos
ckir = "ckir"
aiprofiles = "aiprofiles"
agy = "agy"
clavity = "clavity"
rea = "rea"
Temurin = "Temurin"
Adoptium = "Adoptium"
Ghidra = "Ghidra"
shfmt = "shfmt"
psanalyze = "psanalyze"
