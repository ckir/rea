name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned tool versions
        id: lock
        run: |
          {
            echo "tools=just@$(sed -n 's/^just=//p' scripts/ci-tools.lock),shellcheck@$(sed -n 's/^shellcheck=//p' scripts/ci-tools.lock),shfmt@$(sed -n 's/^shfmt=//p' scripts/ci-tools.lock),typos@$(sed -n 's/^typos=//p' scripts/ci-tools.lock)"
          } >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: ${{ steps.lock.outputs.tools }}
      # lefthook is not in taiki-e/install-action's manifests (manifests/lefthook.json is a 404 at the pinned
      # commit), so it comes from npm, which ships the official binary, at the version in the lock.
      - name: Install lefthook
        run: npm install --global "lefthook@$(sed -n 's/^lefthook=//p' scripts/ci-tools.lock)"
      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@v$(sed -n 's/^actionlint=//p' scripts/ci-tools.lock)"
      - name: Install addlicense
        run: go install "github.com/google/addlicense@v$(sed -n 's/^addlicense=//p' scripts/ci-tools.lock)"
      - name: Put Go binaries on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install PowerShell modules
        shell: pwsh
        run: |
          $analyzer = (Select-String -Path scripts/ci-tools.lock -Pattern '^psscriptanalyzer=(.*)$').Matches[0].Groups[1].Value
          $pester = (Select-String -Path scripts/ci-tools.lock -Pattern '^pester=(.*)$').Matches[0].Groups[1].Value
          Install-Module PSScriptAnalyzer -RequiredVersion $analyzer -Force
          Install-Module Pester -RequiredVersion $pester -Force
      - name: Gates
        run: just check

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bash on every OS, Git Bash on Windows: sed is the one reader of the lock the gates job also uses.
      - name: Read pinned tool versions
        id: lock
        shell: bash
        run: echo "tools=just@$(sed -n 's/^just=//p' scripts/ci-tools.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: ${{ steps.lock.outputs.tools }}
      # Pester at the version in the lock for pwsh, the shell `just test` runs it in; the 5.1 step below installs
      # its own copy, because Windows PowerShell does not search pwsh's CurrentUser module path.
      - name: Install Pester for pwsh
        shell: pwsh
        run: |
          $pester = (Select-String -Path scripts/ci-tools.lock -Pattern '^pester=(.*)$').Matches[0].Groups[1].Value
          Install-Module Pester -RequiredVersion $pester -Force -SkipPublisherCheck -Scope CurrentUser
      # tests/sh run under POSIX shells only. Git Bash on windows-latest reports a MINGW uname, which setup.sh maps
      # to the "windows" platform, so most of that suite would test a path nobody supports (setup.ps1 is the
      # Windows script). Windows therefore runs the Pester suite alone.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: just test
      - name: Unit tests (Pester only, see above)
        if: runner.os == 'Windows'
        run: just test-pester
      - name: Integration tests (loopback fake release server)
        if: runner.os == 'Linux'
        run: just test-integration
      - name: Pester under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pester = (Select-String -Path scripts/ci-tools.lock -Pattern '^pester=(.*)$').Matches[0].Groups[1].Value
          Install-Module Pester -RequiredVersion $pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion $pester
          Invoke-Pester -Path tests/pester -CI
