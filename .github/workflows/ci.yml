name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned tool versions
        id: lock
        run: |
          {
            echo "tools=just@$(sed -n 's/^just=//p' scripts/ci-tools.lock),shellcheck@$(sed -n 's/^shellcheck=//p' scripts/ci-tools.lock),shfmt@$(sed -n 's/^shfmt=//p' scripts/ci-tools.lock),typos@$(sed -n 's/^typos=//p' scripts/ci-tools.lock)"
          } >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: ${{ steps.lock.outputs.tools }}
      # lefthook is not in taiki-e/install-action's manifests (manifests/lefthook.json is a 404 at the pinned
      # commit), so it comes from npm, which ships the official binary, at the version in the lock.
      - name: Install lefthook
        run: npm install --global "lefthook@$(sed -n 's/^lefthook=//p' scripts/ci-tools.lock)"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.2.0
      - name: Put Go binaries on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install PowerShell modules
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force; Install-Module Pester -RequiredVersion 5.9.0 -Force
      - name: Gates
        run: just check

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.58.0
      # Pester 5.9.0 for pwsh, the shell `just test` runs it in; the 5.1 step below installs its own copy, because
      # Windows PowerShell does not search pwsh's CurrentUser module path.
      - name: Install Pester 5.9.0 for pwsh
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.9.0 -Force -SkipPublisherCheck -Scope CurrentUser
      # tests/sh run under POSIX shells only. Git Bash on windows-latest reports a MINGW uname, which setup.sh maps
      # to the "windows" platform, so most of that suite would test a path nobody supports (setup.ps1 is the
      # Windows script). Windows therefore runs the Pester suite alone.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: just test
      - name: Unit tests (Pester only, see above)
        if: runner.os == 'Windows'
        run: just test-pester
      - name: Integration tests (loopback fake release server)
        if: runner.os == 'Linux'
        run: just test-integration
      - name: Pester under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.9.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.9.0
          Invoke-Pester -Path tests/pester -CI
