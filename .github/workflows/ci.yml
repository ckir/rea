name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned tool versions
        id: lock
        run: |
          {
            echo "tools=just@$(sed -n 's/^just=//p' scripts/ci-tools.lock),shellcheck@$(sed -n 's/^shellcheck=//p' scripts/ci-tools.lock),shfmt@$(sed -n 's/^shfmt=//p' scripts/ci-tools.lock),typos@$(sed -n 's/^typos=//p' scripts/ci-tools.lock)"
          } >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: ${{ steps.lock.outputs.tools }}
      # lefthook is not in taiki-e/install-action's manifests (manifests/lefthook.json is a 404 at the pinned
      # commit), so it comes from npm, which ships the official binary, at the version in the lock.
      - name: Install lefthook
        run: npm install --global "lefthook@$(sed -n 's/^lefthook=//p' scripts/ci-tools.lock)"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.2.0
      - name: Put Go binaries on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install PowerShell modules
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force; Install-Module Pester -RequiredVersion 5.9.0 -Force
      - name: Gates
        run: just check

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.58.0
      - name: Install Pester 5.9.0 where no 5.x is present
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser
          }
      - name: Unit tests
        run: just test
      - name: Pester under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Import-Module Pester -MinimumVersion 5.0; Invoke-Pester -Path tests/pester -CI"
