# Weekly drift check: do the pins in setup.sh and setup.ps1 still match what the upstream releases publish?
# --check-upstream fetches no archive and writes nothing; it prints one ok or FAIL line per expectation and
# exits 5 when one fails. Node is installed because both scripts require it at the supported floor in prereq.

name: Canary

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check upstream (POSIX)
        if: runner.os != 'Windows'
        run: sh setup.sh --check-upstream --yes
      - name: Check upstream (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -CheckUpstream -Yes
