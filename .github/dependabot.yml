# Keeps the SHA-pinned actions in .github/workflows current. Dependabot rewrites `uses: owner/repo@<sha> # vX`
# lines in place and keeps the `# vX` comment, which scripts/check-action-pins.sh requires. It does NOT see the
# tool versions in scripts/ci-tools.lock, the one place the workflows read them from (scripts/check-ci-tool-pins.sh
# enforces that); those are bumped by hand (see CONTRIBUTING.md).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
